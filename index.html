<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #121212;
      --bg-card: #181818;
      --bg-card-hover: #282828;
      --accent: #1ed760;
      --text-main: #ffffff;
      --text-sub: #a7a7a7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 90px);
      gap: 8px;
      padding: 8px;
    }

    .sidebar {
      width: 280px;
      background-color: var(--bg-surface);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-sub);
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-item:hover, .nav-item.active { color: var(--text-main); }

    .main-content {
      flex: 1;
      background-color: var(--bg-surface);
      border-radius: 8px;
      overflow-y: auto;
      padding: 24px;
    }

    .search-bar-container {
      position: sticky;
      top: 0;
      background: rgba(18, 18, 18, 0.8);
      backdrop-filter: blur(12px);
      padding-bottom: 20px;
      z-index: 10;
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      background: #242424;
      border-radius: 50px;
      padding: 10px 16px;
      width: 320px;
    }

    .search-input-wrapper input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.9rem;
      margin-left: 10px;
      width: 100%;
    }

    .section-title { font-size: 1.5rem; margin-bottom: 16px; font-weight: 700; }

    .track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--bg-card);
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      position: relative;
    }

    .card:hover { background: var(--bg-card-hover); }

    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-badge {
      position: absolute;
      bottom: 85px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 1.2rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    .card:hover .play-badge { opacity: 1; transform: translateY(0); }

    .player-bar {
      height: 90px;
      background: var(--bg-base);
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .now-playing { display: flex; align-items: center; gap: 14px; width: 30%; }
    .now-playing img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; }
    .track-details { display: flex; flex-direction: column; gap: 2px; }
    .track-name { font-weight: 600; font-size: 0.9rem; }
    .track-artist { font-size: 0.75rem; color: var(--text-sub); }

    .center-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 40%; }
    .control-buttons { display: flex; align-items: center; gap: 20px; }
