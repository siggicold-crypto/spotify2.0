<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #121212;
      --bg-card: #181818;
      --bg-card-hover: #282828;
      --accent: #1ed760;
      --text-main: #ffffff;
      --text-sub: #a7a7a7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 170px);
      gap: 8px;
      padding: 8px;
    }

    .sidebar {
      width: 280px;
      background-color: var(--bg-surface);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-sub);
      font-weight: 600;
      cursor: pointer;
    }
    .nav-item.active { color: var(--text-main); }

    .main-content {
      flex: 1;
      background-color: var(--bg-surface);
      border-radius: 8px;
      overflow-y: auto;
      padding: 24px;
    }

    .section-title { font-size: 1.5rem; margin-bottom: 16px; font-weight: 700; }

    .track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--bg-card);
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      position: relative;
    }

    .card:hover { background: var(--bg-card-hover); }

    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-badge {
      position: absolute;
      bottom: 85px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 1.2rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    .card:hover .play-badge { opacity: 1; transform: translateY(0); }

    .player-container {
      height: 160px;
      background: var(--bg-base);
      border-top: 1px solid #282828;
      padding: 5px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <div class="sidebar">
      <div class="brand"><i class="fa-brands fa-spotify" style="color: var(--accent); font-size: 1.8rem;"></i> Spotify 2.0</div>
      <ul class="nav-list">
        <li class="nav-item active"><i class="fa-solid fa-house"></i> Home</li>
        <li class="nav-item"><i class="fa-solid fa-heart"></i> Liked Songs</li>
      </ul>
    </div>

    <div class="main-content">
      <h2 class="section-title">Featured Full Tracks</h2>
      <div class="track-grid" id="trackGrid"></div>
    </div>
  </div>

  <div class="player-container">
    <iframe id="sc-player" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&color=%231ed760&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"></iframe>
  </div>

  <script>
    const tracks = [
      {
        title: "Starboy",
        artist: "The Weeknd",
        artwork: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400",
        scUrl: "https://soundcloud.com/theweeknd/starboy-1"
      },
      {
        title: "Blinding Lights",
        artist: "The Weeknd",
        artwork: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400",
        scUrl: "https://soundcloud.com/theweeknd/blinding-lights"
      },
      {
        title: "Sunflower",
        artist: "Post Malone & Swae Lee",
        artwork: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=400",
        scUrl: "https://soundcloud.com/postmalone/sunflower-spider-man-into-the-spider-verse"
      },
      {
        title: "Lofi Hip Hop Radio",
        artist: "Lofi Girl",
        artwork: "https://images.unsplash.com/photo-1511192336575-5a79af67a629?w=400",
        scUrl: "https://soundcloud.com/lofigirl/lofi-hip-hop-radio-beats-to-relaxstudy-to"
      }
    ];

    const grid = document.getElementById('trackGrid');
    const iframe = document.getElementById('sc-player');

    grid.innerHTML = tracks.map((track, idx) => `
      <div class="card" onclick="playTrack('${track.scUrl}')">
        <img src="${track.artwork}" alt="${track.title}">
        <div class="play-badge"><i class="fa-solid fa-play"></i></div>
        <div class="card-title">${track.title}</div>
        <div class="card-sub">${track.artist}</div>
      </div>
    `).join('');

    function playTrack(url) {
      const encodedUrl = encodeURIComponent(url);
      iframe.src = `https://w.soundcloud.com/player/?url=${encodedUrl}&color=%231ed760&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`;
    }
  </script>
</body>
</html>
